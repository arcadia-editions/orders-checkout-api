name: Release one API artifact family

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Single artifact family to release.
        required: true
        type: choice
        options:
          - zdl
          - openapi
          - asyncapi
          - api-product
      version:
        description: Release version without v or an artifact prefix.
        required: true
        type: string
      development-version:
        description: Explicit next development version ending in -SNAPSHOT.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
    uses: arcadia-editions/api-product-workflows/.github/workflows/artifact-release.yml@main
    with:
      workflow_ref: main
      service_repository: orders-checkout-api
      artifact: ${{ inputs.artifact }}
      version: ${{ inputs.version }}
      development_version: ${{ inputs['development-version'] }}
      default_branch: main
      architecture_repository: arcadia-editions/arcadia-editions-docs
      architecture_ref: main
      architecture_manifest_path: zenwave-architecture.yml
    secrets:
      checkout_token: ${{ secrets.ARTIFACT_WORKFLOWS_CHECKOUT_TOKEN }}
      release_token: ${{ secrets.ARTIFACT_RELEASE_TOKEN }}
      architecture_token: ${{ secrets.ARCHITECTURE_APP_TOKEN }}
      maven_username: ${{ secrets.MAVEN_REPOSITORY_USERNAME }}
      maven_password_or_token: ${{ secrets.MAVEN_REPOSITORY_PASSWORD_OR_TOKEN }}
      apicurio_username: ${{ secrets.APICURIO_USERNAME }}
      apicurio_password_or_token: ${{ secrets.APICURIO_PASSWORD_OR_TOKEN }}
