name: API artifact CI and snapshots

on:
  pull_request:
    branches: [main]
    paths:
      - domain-model.zdl
      - openapi.yml
      - asyncapi.yml
      - asyncapi-client.yml
      - "**/*.avsc"
      - .arcadia/**
      - README.md
      - SUMMARY.md
      - CHANGELOG.md
      - release-notes/**
      - .github/workflows/artifacts.yml
      - .github/workflows/release-artifact.yml
  push:
    branches: [main]
    paths:
      - domain-model.zdl
      - openapi.yml
      - asyncapi.yml
      - asyncapi-client.yml
      - "**/*.avsc"
      - .arcadia/**
      - README.md
      - SUMMARY.md
      - CHANGELOG.md
      - release-notes/**
      - .github/workflows/artifacts.yml
      - .github/workflows/release-artifact.yml
  workflow_dispatch:
    inputs:
      publish_snapshots:
        description: Publish the selected family after the full validation rerun.
        required: false
        default: false
        type: boolean
      artifact:
        description: Family to publish for an authorized manual snapshot.
        required: false
        default: api-product
        type: choice
        options:
          - zdl
          - openapi
          - asyncapi
          - api-product

permissions:
  contents: read

jobs:
  ci:
    uses: arcadia-editions/api-product-workflows/.github/workflows/artifact-ci.yml@main
    with:
      workflow_ref: main
      service_repository: orders-checkout-api
      architecture_repository: arcadia-editions/arcadia-editions-docs
      architecture_ref: main
      architecture_manifest_path: zenwave-architecture.yml
      base_sha: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      head_sha: ${{ github.sha }}
      full_validation: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ secrets.ARTIFACT_WORKFLOWS_CHECKOUT_TOKEN }}

  snapshot:
    needs: ci
    if: >-
      needs.ci.result == 'success' &&
      ((github.event_name == 'push' && github.ref_name == 'main') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_snapshots))
    uses: arcadia-editions/api-product-workflows/.github/workflows/artifact-snapshot.yml@main
    with:
      workflow_ref: main
      service_repository: orders-checkout-api
      plan: ${{ github.event_name == 'workflow_dispatch' && format('[{{"type":"{0}","changedFiles":[]}}]', inputs.artifact) || needs.ci.outputs.publication_plan }}
      source_sha: ${{ github.sha }}
      default_branch: main
      architecture_repository: arcadia-editions/arcadia-editions-docs
      architecture_ref: main
      architecture_manifest_path: zenwave-architecture.yml
    secrets:
      checkout_token: ${{ secrets.ARTIFACT_WORKFLOWS_CHECKOUT_TOKEN }}
      maven_username: ${{ secrets.MAVEN_REPOSITORY_USERNAME }}
      maven_password_or_token: ${{ secrets.MAVEN_REPOSITORY_PASSWORD_OR_TOKEN }}
      apicurio_username: ${{ secrets.APICURIO_USERNAME }}
      apicurio_password_or_token: ${{ secrets.APICURIO_PASSWORD_OR_TOKEN }}
