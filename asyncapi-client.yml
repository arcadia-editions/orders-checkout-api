asyncapi: 3.0.0
id: urn:com.arcadiaeditions:orders:checkout:asyncapi:client
info:
  title: "Arcadia Editions - Orders Checkout - AsyncAPI Client"
  version: 1.0.0
  description: "Consumed AsyncAPI channels for Arcadia Editions - Orders Checkout."

channels:

  payment-authorized-event-v1:
    $ref: 'https://raw.githubusercontent.com/arcadia-editions/payments-processing-api/main/asyncapi.yml#/channels/payment-authorized-event-v1'

  stock-released-event-v1:
    $ref: 'https://raw.githubusercontent.com/arcadia-editions/catalog-inventory-api/main/asyncapi.yml#/channels/stock-released-event-v1'



operations:

  onPaymentAuthorizedEventV1:
    action: receive
    channel:
      $ref: '#/channels/payment-authorized-event-v1'

  onStockReleasedEventV1:
    action: receive
    channel:
      $ref: '#/channels/stock-released-event-v1'

